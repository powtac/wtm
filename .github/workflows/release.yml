name: Release

# This workflow intentionally remains tag-only; every release input is immutable.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Sign, notarize, verify, and publish
    if: >-
      github.repository == 'powtac/wtm' &&
      github.event.repository.visibility == 'public'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release input
        run: |
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-list -n 1 "$GITHUB_REF_NAME")" == "$GITHUB_SHA" ]]
          project_version="$(sed -n 's/^MARKETING_VERSION = //p' Config/Base.xcconfig)"
          [[ "$GITHUB_REF_NAME" == "v$project_version" ]]

      - name: Verify successful CI for exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-release-ci "$GITHUB_REPOSITORY" "$GITHUB_SHA"

      - name: Verify release toolchain
        run: |
          xcodebuild -version
          swift --version
          ./scripts/build-distribution --preflight

      - name: Import ephemeral Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/wtm-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id-application.p12"
          unlocked_certificate="$RUNNER_TEMP/developer-id-application.pem"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/openssl pkcs12 -in "$certificate" -passin env:CERTIFICATE_PASSWORD -nodes \
            -out "$unlocked_certificate"
          /usr/bin/security import "$unlocked_certificate" -k "$keychain" -f pemseq \
            -T /usr/bin/codesign
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          /usr/bin/security list-keychains -d user -s "$keychain"
          identity="$(/usr/bin/security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [[ -n "$identity" ]]
          echo "WTM_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm -f "$certificate"
          rm -f "$unlocked_certificate"

      - name: Build notarized distribution
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/app-store-connect-key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          WTM_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$NOTARY_KEY_BASE64" | /usr/bin/base64 -D > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          mkdir "$RUNNER_TEMP/release-assets"
          ./scripts/build-distribution "$RUNNER_TEMP/release-assets"
          ./scripts/audit-release-artifacts "$RUNNER_TEMP/release-assets"

      - name: Upload verified release backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 30

      - name: Revalidate release tag target before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_tag_sha="$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$remote_tag_sha" ]]; then
            remote_tag_sha="$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 { print $1 }')"
          fi
          [[ "$remote_tag_sha" == "$GITHUB_SHA" ]]

      - name: Attest public release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release-assets/*

      - name: Create draft release after all gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release-assets/WTM-${release_version}-arm64.dmg" \
            "$RUNNER_TEMP/release-assets/WTM-${release_version}.spdx.json" \
            "$RUNNER_TEMP/release-assets/WTM-${release_version}.sha256" \
            "$RUNNER_TEMP/release-assets/release-metadata.json" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "WTM ${GITHUB_REF_NAME#v}"

      - name: Publish release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_tag_sha="$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$remote_tag_sha" ]]; then
            remote_tag_sha="$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 { print $1 }')"
          fi
          [[ "$remote_tag_sha" == "$GITHUB_SHA" ]]
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Remove ephemeral signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/wtm-signing.keychain-db"
          /usr/bin/security delete-keychain "$keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id-application.p12"
          rm -f "$RUNNER_TEMP/developer-id-application.pem"
          rm -f "$RUNNER_TEMP/app-store-connect-key.p8"
